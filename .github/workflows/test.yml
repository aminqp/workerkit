# Lint, type checks and unit tests, then the browser suites in Chromium,
# Firefox and WebKit: the library scenarios (against the source and the built
# package), every demo card, and the React example.
name: Test

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types and unit tests
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu releases,
    # which ubuntu-latest moves to without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # These jobs never push, so the GitHub token need not stay on disk.
          persist-credentials: false

      - name: Setup pnpm
        # Third-party action: pinned to the commit of release v4.4.0.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec eslint .

      - name: Type check
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build the library
        run: pnpm run build:lib

      - name: Type check the React example
        run: pnpm --filter workerkit-example-react-mui typecheck

  browsers:
    name: Browser tests (${{ matrix.browser }})
    # Pinned: Playwright 1.56 has no browser builds for newer Ubuntu releases,
    # which ubuntu-latest moves to without notice.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      E2E_BROWSERS: ${{ matrix.browser }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # These jobs never push, so the GitHub token need not stay on disk.
          persist-credentials: false

      - name: Setup pnpm
        # Third-party action: pinned to the commit of release v4.4.0.
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      - name: Library scenarios (source and built package)
        run: pnpm exec playwright test --project="*:harness*"
        env:
          E2E_DIST: '1'

      - name: Demo app (development and production builds)
        run: pnpm exec playwright test --project="*:demo*"

      - name: React example (development and production builds)
        run: pnpm run test:e2e:example

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}
          path: |
            test-results/
            examples/react-mui/test-results/
          retention-days: 7
